[project]
name = "kda5-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "taego", email = "devtaego@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "ddgs>=9.16.0",
    "finance-datareader>=0.9.202",
    "google-genai>=2.29.0",
    "gradio>=6.30.0",
    "langchain>=1.4.5",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.1",
    "langchain-openai>=1.7.1",
    "langchain-redis>=0.2.6",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langgraph-cli>=0.4.35",
    "markdownify>=1.2.3",
    "openai>=3.26.0",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pydub>=0.25.1",
    "pykrx>=1.0.51",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "qrcode[pil]>=8.2",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "setuptools<81",
    "tavily-python>=0.8.5",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
kda5-ai = "kda5_ai:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "langgraph-cli[inmem]>=0.4.35",
]
