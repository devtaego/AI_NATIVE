[project]
name = "kda5-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "taego", email = "devtaego@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.29.0",
    "openai>=3.26.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
kda5-ai = "kda5_ai:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
